# SPDX-License-Identifier: GPL-2.0-or-later
name: Andarium iOS 17 compatibility
on:
  push:
    branches: [andarium/ios17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build AndariumCore and GuestHostCore for iOS 17 devices
        working-directory: Andarium/AndariumCore
        run: |
          xcodebuild -scheme AndariumCore -configuration Release \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 CODE_SIGNING_ALLOWED=NO build
      - name: Compile Metal memory accounting for iOS 17 devices
        run: |
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios17.0 \
            -std=c++20 -fobjc-arc -Wall -Wextra -Werror -I darwin/platform \
            -c darwin/platform/apple/host_gpu_memory.mm -o "$RUNNER_TEMP/host_gpu_memory.o"
  interface:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build shared interface for iOS 17
        run: |
          xcodebuild -project Andarium/Andarium.xcodeproj -scheme AndariumPreview \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 CODE_SIGNING_ALLOWED=NO build
